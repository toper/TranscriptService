name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TranscriptService.slnx

      - name: Build
        run: dotnet build TranscriptService.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TranscriptService.slnx -c Release --no-build
