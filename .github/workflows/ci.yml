name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TranscriptService.slnx

      - name: Build
        run: dotnet build TranscriptService.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution TranscriptService.slnx -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  docker:
    # Every image must keep building; CUDA images are built but cannot run on hosted runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/TranscriptService.Api/Dockerfile
            target: final
            device: cpu
          - name: whispernet-cpu
            dockerfile: src/TranscriptService.Worker.WhisperNet/Dockerfile
            target: runtime-cpu
            device: cpu
          - name: whispernet-cuda
            dockerfile: src/TranscriptService.Worker.WhisperNet/Dockerfile
            target: runtime-cuda
            device: cuda
    name: docker (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: COMPUTE_DEVICE=${{ matrix.device }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          # CUDA layers are several GB; caching them would evict everything else from the 10 GB cache.
          cache-to: ${{ matrix.device == 'cpu' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
