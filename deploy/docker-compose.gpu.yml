# GPU override: CUDA images and one NVIDIA GPU per worker (requires the NVIDIA Container Toolkit).
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml --profile whispernet up --build

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  worker-whispernet:
    <<: *gpu
    image: transcriptservice-whispernet:cuda
    build:
      target: runtime-cuda

  worker-fasterwhisper:
    <<: *gpu
    image: transcriptservice-fasterwhisper:cuda
    build:
      target: runtime-cuda
      args:
        # FasterWhisper.NET's GPU build links CUDA 12 and cuDNN 8 (kernels up to sm_120).
        CUDA_IMAGE: nvidia/cuda:12.8.1-runtime-ubuntu22.04
        CUDA_PACKAGES: libcudnn8
